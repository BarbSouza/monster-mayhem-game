<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monster Mayhem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby">
        <h1>Monster Mayhem</h1>

        <div id="lobby-stats">
            <p>🎮 Total Games Played: <span id="lobby-total-games">0</span></p>
        </div>   
        
            <div id="open-games">
                <h3>Open Games</h3>
                <ul id="open-games-list">
                    <li>No open games yet...</li>
                </ul>
            </div>

        <input type="text" id="playerName" placeholder="Enter your name" />
        <button onclick="createGame()">Create Game</button>
        <button onclick="joinGame()">Join Game</button>
        <input type="text" id="gameCode" placeholder="Game code to join" />
    </div>

    <div id="game" style="display:none">
        <div id="stats-bar">
            <span>🎮 Games Played: <strong id="total-games">0</strong></span>
            <span>🏆 My Wins: <strong id="my-wins">0</strong></span>
            <span>💀 My Losses: <strong id="my-losses">0</strong></span>
        </div>
        <h2 id="gameInfo"></h2>
        
        <div id="controls">
            <p>Select a monster to place on your edge:</p>
            <button onclick="selectMonster('vampire')">🧛 Vampire</button>
            <button onclick="selectMonster('werewolf')">🐺 Werewolf</button>
            <button onclick="selectMonster('ghost')">👻 Ghost</button>
            <button onclick="selectMonster(null)">❌ Cancel</button>
            <button onclick="endTurn()">✅ End Turn</button>
            <p id="statusText">Waiting for game to start...</p>
        </div>
        <div id="scoreboard">
            <p>🔴 Player 1 losses: <span id="losses-0">0</span>/10</p>
            <p>🔵 Player 2 losses: <span id="losses-1">0</span>/10</p>
        </div>
        <div id="board"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
